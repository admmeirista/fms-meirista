<!DOCTYPE html>
<html lang="id">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"><title>Meirista Fulfillment System</title>
  <meta charset="utf-8">
  <meta name="theme-color" content="#0f172a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#28302b;--ink-2:#323b35;--ink-3:#3c463f;--ink-line:rgba(255,255,255,.09);--sage:#a7b5a9;--sage-2:#7d8c80;
  --bg:#f7f6f1;--card:#fff;--line:#e8e5dc;--line-2:#f1efe8;--fg:#1d2420;--muted:#78807a;
  --acc:#e8693a;--acc-2:#d4572a;--acc-soft:#fcece3;--acc-ink:#b0461d;
  --ok:#3b8a58;--ok-soft:#e6f2ea;--warn:#b7821c;--warn-soft:#fbf2dd;--err:#c9443a;--err-soft:#fbe7e4;--info:#3c6fa8;--info-soft:#e7eff8;
  --r:14px;--shadow:0 1px 2px rgba(29,36,32,.04),0 6px 20px rgba(29,36,32,.05);
  --font:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc-ink);text-decoration:none}a:hover{text-decoration:underline}
h1,h2,h3,h4{letter-spacing:-.025em;margin:0}
.hidden{display:none!important}.muted{color:var(--muted)}.mono{font-family:var(--mono);letter-spacing:-.01em}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1}.right{margin-left:auto}
.ic{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
/* tombol: umpan balik instan */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:0 14px;cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap;transition:background .12s,border-color .12s,transform .06s,box-shadow .12s;position:relative;user-select:none}
.btn:hover{background:#faf9f5;border-color:#dcd8cc}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 2px 8px rgba(232,105,58,.25)}.btn.pri:hover{background:var(--acc-2);border-color:var(--acc-2)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.err{background:var(--err);border-color:var(--err);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}.btn.ghost:hover{background:rgba(0,0,0,.04)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn.busy{color:transparent!important;pointer-events:none}
.btn.busy::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-color:rgba(0,0,0,.25);border-top-color:var(--acc);animation:spin .6s linear infinite}
.btn.pri.busy::after,.btn.ok.busy::after,.btn.err.busy::after{border-color:rgba(255,255,255,.4);border-top-color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--acc);animation:spin .6s linear infinite;display:inline-block}
input.in,select.in,textarea.in{height:40px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:#fff;min-width:0;transition:border-color .12s,box-shadow .12s;outline:none}
textarea.in{height:auto;padding:10px 12px}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--acc);box-shadow:0 0 0 4px rgba(232,105,58,.12)}
label.f{display:block;margin:14px 0 6px;font-weight:600;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px 3px 8px;font-size:11px;font-weight:700;letter-spacing:.02em;white-space:nowrap;background:#efede6;color:#4e5751}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.75}
.b-IMPORTED{background:#efede6;color:#5d655f}.b-READY_FOR_PICKING{background:var(--info-soft);color:var(--info)}
.b-PICKING_IN_PROGRESS{background:var(--warn-soft);color:var(--warn)}.b-PICKING_COMPLETED{background:#ece9f8;color:#5b4fa8}
.b-PACKING_IN_PROGRESS{background:var(--acc-soft);color:var(--acc-ink)}.b-PACKING_COMPLETED{background:var(--ok-soft);color:var(--ok)}
.b-EXCEPTION{background:var(--err-soft);color:var(--err)}.b-CANCELLED{background:#f0efea;color:#9aa19c;text-decoration:line-through}
.b-ACTIVE,.b-UPLOADED,.b-RESOLVED,.b-COMPLETED{background:var(--ok-soft);color:var(--ok)}.b-INACTIVE,.b-FAILED,.b-OPEN{background:var(--err-soft);color:var(--err)}
.b-PENDING,.b-UPLOADING,.b-LOGGED{background:var(--warn-soft);color:var(--warn)}.b-PURGED{background:#f0efea;color:#8a918c}
.b-SUPER_ADMIN{background:#f6e6ef;color:#9b3a6c}.b-ADMIN{background:#ece9f8;color:#5b4fa8}.b-PICKER{background:var(--info-soft);color:var(--info)}.b-PACKER{background:var(--acc-soft);color:var(--acc-ink)}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
table.t th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);padding:11px 12px;background:#fbfaf6;position:sticky;top:0;z-index:1}
table.t td{border-bottom:1px solid var(--line-2);padding:10px 12px;vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t tr.click{cursor:pointer}table.t tr.click:hover td{background:#fcfbf8}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff;max-height:70vh;box-shadow:var(--shadow)}
/* progress global & toast & modal */
#topbar{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acc),#f3a37f);z-index:10000;transition:width .25s ease,opacity .3s;opacity:0;box-shadow:0 0 8px rgba(232,105,58,.5)}
#topbar.on{opacity:1;width:80%;transition:width 8s cubic-bezier(.1,.7,.2,1),opacity .1s}
#topbar.done{opacity:0;width:100%;transition:width .15s,opacity .35s .15s}
#toasts{position:fixed;z-index:9999;top:14px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;width:min(92vw,440px)}
.toast{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;color:#fff;font-weight:600;font-size:13.5px;box-shadow:0 12px 32px rgba(0,0,0,.18);background:var(--ink);animation:tin .18s ease-out}
.toast.ok{background:#2f6e47}.toast.err{background:#a8352c}.toast.warn{background:#8f6614}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
.modal-bg{position:fixed;inset:0;background:rgba(29,36,32,.5);backdrop-filter:blur(2px);z-index:9000;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .12s}
@keyframes fade{from{opacity:0}}
.modal{background:#fff;color:var(--fg);border-radius:18px;max-width:min(96vw,620px);width:100%;max-height:92vh;overflow:auto;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.25);animation:pop .16s ease-out}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:.6}}
.modal.wide{max-width:min(96vw,1120px)}
.modal h3{margin:0 0 12px;font-size:18px}
.err-box,.ok-box,.warn-box,.info-box{border-radius:10px;padding:11px 13px;margin-top:10px;font-weight:600;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.err-box{background:var(--err-soft);color:var(--err)}.ok-box{background:var(--ok-soft);color:var(--ok)}.warn-box{background:var(--warn-soft);color:#8a6312}.info-box{background:var(--info-soft);color:var(--info)}
/* brand */
.brand{display:flex;align-items:center;gap:12px}
.brand .mark{width:40px;height:40px;border-radius:11px;background:linear-gradient(140deg,#f07a4b,#d9562a);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;font-weight:800;font-size:20px;letter-spacing:-.04em;box-shadow:0 6px 16px rgba(232,105,58,.3),inset 0 1px 0 rgba(255,255,255,.25)}
.brand .word{font-weight:800;font-size:18px;letter-spacing:-.03em;color:#fff;line-height:1.1}
.brand .tag{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--sage);font-weight:700;margin-top:3px}
.brand.sm .mark{width:34px;height:34px;border-radius:10px;font-size:17px}.brand.sm .word{font-size:16px}.brand.sm .tag{font-size:8.5px}
.brand.dark .word{color:var(--fg)}.brand.dark .tag{color:var(--muted)}
/* ───────── AUTH (login / ganti password) ───────── */
.auth{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:100vh}
.auth-art{background:var(--ink);color:#eef1ec;padding:40px 64px 30px;position:relative;overflow:hidden;display:flex;flex-direction:column}
.auth-art::before{content:'';position:absolute;inset:0;background:radial-gradient(1200px 600px at 110% -10%,rgba(232,105,58,.14),transparent 55%),radial-gradient(900px 500px at -20% 120%,rgba(167,181,169,.08),transparent 60%);pointer-events:none}
.auth-art::after{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent);-webkit-mask-image:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent);pointer-events:none}
.auth-art>*{position:relative;z-index:1}
.art-mid{margin:auto 0;padding:48px 0;max-width:520px}
.auth-art .eb{color:#f3a37f;display:inline-flex;align-items:center;gap:8px;background:rgba(232,105,58,.1);border:1px solid rgba(232,105,58,.25);padding:6px 12px;border-radius:999px;font-size:10.5px}
.auth-art h1{font-size:clamp(34px,3.6vw,50px);line-height:1.1;letter-spacing:-.04em;font-weight:700;margin:22px 0 0}
.auth-art h1 em{font-style:normal;background:linear-gradient(90deg,#f39066,#e8693a);-webkit-background-clip:text;background-clip:text;color:transparent}
.auth-art p.lead{color:var(--sage);font-size:15.5px;line-height:1.75;margin:18px 0 0}
.flow{list-style:none;padding:0;margin:38px 0 0;position:relative}
.flow::before{content:'';position:absolute;left:21px;top:22px;bottom:22px;width:1px;background:linear-gradient(var(--ink-line),rgba(232,105,58,.45),var(--ink-line))}
.flow li{display:flex;gap:16px;align-items:flex-start;padding:10px 0}
.flow .node{width:44px;height:44px;border-radius:12px;background:#2f3832;border:1px solid var(--ink-line);display:flex;align-items:center;justify-content:center;color:#dfe5df;flex-shrink:0;position:relative}
.flow li:nth-child(3) .node{color:#f3a37f;border-color:rgba(232,105,58,.35)}
.flow .node .ic{width:19px;height:19px}
.flow .k{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--sage-2);font-weight:700;margin-top:2px}
.flow .v{font-weight:700;font-size:14.5px;color:#f3f5f2}
.flow .d{font-size:12.5px;color:var(--sage);margin-top:1px}
.auth-art .foot{display:flex;align-items:center;gap:10px;color:var(--sage-2);font-size:12px}
.auth-art .foot .sep{width:4px;height:4px;border-radius:50%;background:var(--sage-2);opacity:.5}
.auth-art .foot .ic{width:14px;height:14px}
.auth-form{display:flex;flex-direction:column;justify-content:center;padding:48px clamp(24px,6vw,88px);position:relative;background:var(--bg)}
.auth-form .box{width:100%;max-width:420px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:36px 34px;box-shadow:0 1px 2px rgba(29,36,32,.04),0 24px 48px -12px rgba(29,36,32,.12)}
.auth-form .mobile-brand{display:none;margin-bottom:22px}
.auth-form h2{font-size:27px;font-weight:700;letter-spacing:-.035em;margin:10px 0 8px}
.auth-form .sub{color:var(--muted);margin-bottom:6px;font-size:13.5px}
.auth-form label.f{margin-top:18px}
.auth-form input.in{height:50px;width:100%;font-size:15px;padding:0 15px;border-radius:12px;background:#fcfbf8}
.auth-form input.in:focus{background:#fff}
.pw{position:relative}.pw input.in{padding-right:52px}
.pw .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:transparent;color:var(--muted);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.pw .eye:hover{background:var(--line-2);color:var(--fg)}
.cta{width:100%;height:52px;margin-top:26px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 22px;cursor:pointer;box-shadow:0 8px 20px -6px rgba(232,105,58,.55);transition:background .12s,transform .06s,box-shadow .12s;position:relative}
.cta:hover{background:var(--acc-2)}.cta:active{transform:scale(.985)}
.cta:disabled{opacity:.7}
.cta.busy span,.cta.busy .ic{visibility:hidden}.cta.busy::after{content:'';position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .6s linear infinite}
.auth-help{border-top:1px solid var(--line-2);margin-top:26px;padding-top:20px;display:flex;gap:12px;color:var(--muted);font-size:12.5px;line-height:1.5}
.auth-help .ic{color:var(--ok);margin-top:1px}
.auth-help b{display:block;color:#3d4640;font-weight:600}
.auth-tag{position:absolute;bottom:22px;left:0;right:0;text-align:center;font-size:10px;letter-spacing:.24em;color:#b2b6af;font-weight:700}
@media (max-width:900px){
  .auth{grid-template-columns:1fr}
  .auth-art{display:none}
  .auth-form{padding:28px 16px 70px;justify-content:flex-start;min-height:100vh}
  .auth-form .box{padding:28px 22px;border-radius:18px}
  .auth-form .mobile-brand{display:block}
}
/* ───────── ADMIN ───────── */
.adm{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{background:var(--ink);color:var(--sage);padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.side .brand{padding:0 8px 26px}
.side .sec{font-size:10px;letter-spacing:.18em;font-weight:700;color:var(--sage-2);padding:10px 12px 8px}
.side a.nv{display:flex;align-items:center;gap:11px;color:var(--sage);padding:9px 12px;border-radius:10px;margin:1px 0;font-weight:600;font-size:13.5px;cursor:pointer;text-decoration:none;transition:background .12s,color .12s}
.side a.nv:hover{background:rgba(255,255,255,.05);color:#eef1ec}
.side a.nv.on{background:rgba(232,105,58,.15);color:#fff}.side a.nv.on .ic{color:var(--acc)}
.side a.sub{padding:6px 12px 6px 41px;font-size:12.5px;font-weight:500}
.side .me{margin-top:auto;border-top:1px solid var(--ink-line);padding:16px 6px 0;display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--acc-soft);color:var(--acc-ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0}
.side .me .avatar{background:rgba(232,105,58,.18);color:#f3a37f}
.side .me .n{color:#eef1ec;font-weight:700;font-size:13px;line-height:1.2}.side .me .r{font-size:11px;color:var(--sage-2)}
.side .me button{margin-left:auto;background:transparent;border:0;color:var(--sage);cursor:pointer;padding:8px;border-radius:8px}.side .me button:hover{background:rgba(255,255,255,.06);color:#fff}
.main{min-width:0;padding:30px 34px 50px}
.ph{display:flex;align-items:flex-end;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.ph h2{font-size:26px;font-weight:700;letter-spacing:-.035em;margin-top:6px}
.ph .act{margin-left:auto;display:flex;gap:8px;align-items:center}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.stat .chip{width:34px;height:34px;border-radius:10px;background:var(--acc-soft);color:var(--acc);display:flex;align-items:center;justify-content:center}
.stat .chip .ic{width:17px;height:17px}
.stat .v{font-size:27px;font-weight:800;line-height:1;letter-spacing:-.035em}.stat .l{color:var(--muted);font-size:12.5px;font-weight:600}
.stat.hl{background:var(--ink);border-color:var(--ink);color:#fff}.stat.hl .l{color:var(--sage)}.stat.hl .chip{background:rgba(232,105,58,.2)}
.sect{font-size:15px;font-weight:700;margin:26px 0 12px;letter-spacing:-.02em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tabs{display:inline-flex;gap:3px;background:#efede5;border-radius:11px;padding:3px;margin-bottom:16px;flex-wrap:wrap}
.tabs a{padding:7px 14px;cursor:pointer;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted);text-decoration:none}
.tabs a:hover{color:var(--fg)}.tabs a.on{background:#fff;color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:13px}.kv>div:nth-child(odd){color:var(--muted)}
pre.json{white-space:pre-wrap;word-break:break-all;font-size:11px;margin:0;max-width:420px;font-family:var(--mono);color:#4e5751}
.empty{padding:34px;text-align:center;color:var(--muted)}
.loading{display:flex;gap:12px;align-items:center;color:var(--muted);padding:30px 0}
@media (max-width:900px){.adm{grid-template-columns:1fr}.side{position:static;height:auto}.grid2{grid-template-columns:1fr}.main{padding:18px}}
/* ───────── PICKER (mobile 360–480) ───────── */
body.pk-body{background:var(--bg)}
.pk{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:130px}
.pk-bar{background:var(--ink);padding:14px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.pk-bar .avatar{width:34px;height:34px;background:rgba(232,105,58,.2);color:#f3a37f;margin-left:auto}
.pk-bar .icon-btn{background:transparent;border:0;color:var(--sage);width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.pk-bar .icon-btn:active{background:rgba(255,255,255,.08)}
.pk-hero{background:var(--ink);color:#eef1ec;padding:6px 20px 28px;border-radius:0 0 26px 26px;position:relative;overflow:hidden}
.pk-hero::after{content:'';position:absolute;width:300px;height:300px;border-radius:50%;border:34px solid rgba(255,255,255,.03);right:-120px;top:-90px}
.pk-hero .hi{font-size:22px;font-weight:700;letter-spacing:-.03em;margin-top:6px}
.pk-hero .dt{color:var(--sage);font-size:13px}
.pk-kpi{display:flex;gap:10px;margin-top:18px}
.pk-kpi>div{flex:1;background:rgba(255,255,255,.05);border:1px solid var(--ink-line);border-radius:14px;padding:12px 14px}
.pk-kpi .v{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.1}.pk-kpi .l{font-size:11.5px;color:var(--sage);font-weight:600}
.pk-wrap{padding:18px 16px}
.pk-action{width:100%;display:flex;align-items:center;gap:16px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:18px;padding:18px;margin-bottom:12px;cursor:pointer;box-shadow:var(--shadow);transition:transform .06s,box-shadow .12s}
.pk-action:active{transform:scale(.98)}
.pk-action .t{width:54px;height:54px;border-radius:15px;background:var(--acc-soft);color:var(--acc);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pk-action .t .ic{width:26px;height:26px}
.pk-action .h{font-size:17px;font-weight:700;letter-spacing:-.02em}.pk-action .d{font-size:12.5px;color:var(--muted)}
.pk-action .go{margin-left:auto;color:var(--muted)}

  <script>

  upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/>',
  activity: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',

  sliders: '<line x1="4" x2="4" y1="21" y2="14"/><line x1="4" x2="4" y1="10" y2="3"/><line x1="12" x2="12" y1="21" y2="12"/><line x1="12" x2="12" y1="8" y2="3"/><line x1="20" x2="20" y1="21" y2="16"/><line x1="20" x2="20" y1="12" y2="3"/><line x1="2" x2="6" y1="14" y2="14"/><line x1="10" x2="14" y1="8" y2="8"/><line x1="18" x2="22" y1="16" y2="16"/>',
  file: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/>',
  user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>',

  clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  zap: '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  refresh: '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
  camera: '<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>',
  flag: '<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/>',
  undo: '<path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/>',
  truck: '<path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.62L18.3 9.38a1 1 0 0 0-.78-.38H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/>',
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>',
  play: '<polygon points="6 3 20 12 6 21 6 3"/>',
  lock: '<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  monitor: '<rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/>'
};
function icon(name, cls) { return '<svg class="ic ' + (cls || '') + '" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[name] || '') + '</svg>'; }
var APP_NAME = 'Meirista Fulfillment System';
function brand(cls) { return '<div class="brand ' + (cls || '') + '"><div class="mark">M</div><div class="bt"><div class="word">Meirista</div><div class="tag">Fulfillment System</div></div></div>'; }
function initials(name) { return String(name || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(function (w) { return w[0]; }).join('').toUpperCase(); }

var App = {
  token: Store.get('fms_token'),
  me: null,
  view: null,

  /** Buka seketika dari cache sesi; validasi ke server berjalan di belakang. */
  start: function () {
    if (!App.token) return App.showLogin();
    var cached = null;
    try { cached = JSON.parse(Store.get('fms_me') || 'null'); } catch (e) { cached = null; }
    if (cached && cached.user) App.enter(cached);
    else $app().innerHTML = '<div class="loading" style="justify-content:center;min-height:100vh"><span class="spinner"></span>Memuat ruang kerja…</div>';
    api('me', {}, { silent: true, quiet: !!cached }).then(function (me) {
      var roleChanged = !cached || cached.user.role !== me.user.role || cached.user.mustChangePassword !== me.user.mustChangePassword;
      App.remember(me);
      if (roleChanged) App.enter(me); else { App.me = me; if (App.view && App.view.refreshMe) App.view.refreshMe(me); }
    }).catch(function (e) {
      if (['UNAUTHENTICATED', 'SESSION_EXPIRED', 'INACTIVE', 'MUST_CHANGE_PASSWORD'].indexOf(e.code) < 0 && !cached) App.showLogin(e.message);
    });
  },

  remember: function (me) { App.me = me; try { Store.set('fms_me', JSON.stringify(me)); } catch (e) {} },

  enter: function (me) {
    App.remember(me);
    if (App.view && App.view.stop) try { App.view.stop(); } catch (e) {}
    document.body.className = '';
    if (me.user.mustChangePassword) return App.showChangePassword(true);
    var r = me.user.role;
    if (r === 'PICKER') return Picker.start(me);
    if (r === 'PACKER') return Packer.start(me);
    return Admin.start(me);
  },

  authShell: function (formHtml) {
    var flow = [['upload', 'Import pesanan', 'Export Shopee divalidasi otomatis, tanpa duplikat'], ['scan', 'Picking terverifikasi', 'Scan resi & checklist setiap item'],
      ['video', 'Packing berbukti video', 'Rekaman otomatis tersimpan di Google Drive'], ['shield', 'Audit trail lengkap', 'Setiap aksi tercatat per pengguna']];
    $app().innerHTML = '<div class="auth"><section class="auth-art"><div class="art-top">' + brand() + '</div>' +
      '<div class="art-mid"><div class="eyebrow eb">Sistem operasional gudang</div>' +
      '<h1>Pesanan rapi,<br>pengiriman <em>pasti.</em></h1>' +
      '<p class="lead">Satu sistem terpadu untuk mengendalikan setiap pesanan — dari rak gudang hingga paket siap kirim.</p>' +
      '<ol class="flow">' + flow.map(function (f, i) { return '<li><div class="node">' + icon(f[0]) + '</div><div><div class="k">Tahap ' + (i + 1) + '</div><div class="v">' + f[1] + '</div><div class="d">' + f[2] + '</div></div></li>'; }).join('') + '</ol></div>' +
      '<div class="foot"><span>© ' + new Date().getFullYear() + ' Meirista</span><span class="sep"></span>' + icon('lock') + '<span>Akses individual · tercatat di audit trail</span></div></section>' +
      '<section class="auth-form"><div class="box">' + formHtml + '</div><div class="auth-tag">' + APP_NAME.toUpperCase() + '</div></section></div>';
  },

  /** Perangkat terdaftar → daftar nama staf; selain itu → login Admin (username + password). */
  showLogin: function (msg) {
    if (App.view && App.view.stop) try { App.view.stop(); } catch (e) {}
    App.view = null;
    document.body.className = '';
    if (Store.get('fms_device')) return App.showDeviceLogin(msg);
    App.showAdminLogin(msg, false);
  },

  showDeviceLogin: function (msg) {
    var token = Store.get('fms_device');
    var cached = null;
    try { cached = JSON.parse(Store.get('fms_device_info') || 'null'); } catch (e) { cached = null; }
    var render = function (info, err) {
      var d = info && info.device;
      var badge = d ? '<div class="dev-badge"><div class="t">' + icon(d.kind === 'PACKER' ? 'monitor' : 'scan') + '</div><div><div class="n">' + esc(d.name) + '</div><div class="k">' + (d.kind === 'PACKER' ? 'Station packing' + (d.workstation ? ' · ' + esc(d.workstation.code) : '') : 'HP picker') + '</div></div></div>' : '';
      var tiles = !info ? '<div class="loading" style="grid-column:1/-1;justify-content:center"><span class="spinner"></span>Memuat daftar staf…</div>'
        : info.users.length ? info.users.map(function (u) { return '<button class="who" data-u="' + esc(u.id) + '"><div class="avatar">' + esc(initials(u.name)) + '</div>' + esc(u.name) + '</button>'; }).join('')
        : '<div class="warn-box" style="grid-column:1/-1">' + icon('alert') + '<span>Belum ada ' + (d && d.kind === 'PACKER' ? 'packer' : 'picker') + ' aktif. Minta Admin menambahkan user.</span></div>';
      App.authShell('<div class="mobile-brand">' + brand('dark') + '</div>' + badge + '<div class="eyebrow">Mulai shift</div><h2>Siapa yang bertugas?</h2><div class="sub">Ketuk nama Anda untuk masuk — tanpa password.</div>' +
        '<div id="lerr">' + (err ? '<div class="err-box">' + icon('alertCircle') + '<span>' + esc(err) + '</span></div>' : '') + '</div><div class="who-grid">' + tiles + '</div>' +
        '<div class="auth-help">' + icon('shield') + '<div>Setiap aksi tercatat atas nama Anda di audit trail.<b>Nama tidak ada di daftar? Hubungi Admin.</b></div></div>' +
        '<div style="text-align:center;margin-top:16px"><button class="link-btn" id="ladm">Masuk sebagai Admin</button></div>');
      $('#ladm').onclick = function () { App.showAdminLogin('', true); };
      $$('[data-u]').forEach(function (b) {
        b.onclick = function () {
          if (document.querySelector('.who.busy')) return;
          b.classList.add('busy');
          apiWith(null, 'deviceLogin', { deviceToken: token, userId: b.getAttribute('data-u') }, { silent: true })
            .then(function (r) { App.token = r.token; Store.set('fms_token', r.token); App.enter(r.me); })
            .catch(function (e) {
              b.classList.remove('busy');
              if (e.code === 'DEVICE_INVALID') return App.forgetDevice(e.message);
              $('#lerr').innerHTML = '<div class="err-box">' + icon('alertCircle') + '<span>' + esc(e.message) + '</span></div>';
            });
        };
      });
    };
    render(cached, msg);
    apiWith(null, 'deviceInfo', { deviceToken: token }, { silent: true, quiet: !!cached }).then(function (info) {
      Store.set('fms_device_info', JSON.stringify(info));
      if (!document.querySelector('.who.busy') && document.querySelector('.who-grid')) render(info, msg);
    }).catch(function (e) { if (e.code === 'DEVICE_INVALID') App.forgetDevice(e.message); });
  },

  forgetDevice: function (msg) { Store.del('fms_device'); Store.del('fms_device_info'); App.showAdminLogin(msg, false); },

  showAdminLogin: function (msg, fromDevice) {
    App.authShell('<form id="lf" autocomplete="on"><div class="mobile-brand">' + brand('dark') + '</div><div class="eyebrow">' + (fromDevice ? 'Login Admin' : 'Selamat datang') + '</div><h2>Masuk ke akun Anda</h2><div class="sub">Gunakan username dan password yang diberikan administrator gudang.</div>' +
      '<label class="f">Username</label><input class="in" name="identifier" placeholder="Masukkan username" autocomplete="username" autocapitalize="off" spellcheck="false" required>' +
      '<label class="f">Password</label><div class="pw"><input class="in" type="password" name="password" placeholder="Masukkan password" autocomplete="current-password" required><button type="button" class="eye" tabindex="-1" aria-label="Tampilkan password">' + icon('eye') + '</button></div>' +
      '<div id="lerr">' + (msg ? '<div class="err-box">' + icon('alertCircle') + '<span>' + esc(msg) + '</span></div>' : '') + '</div>' +
      '<button class="cta" type="submit"><span>Masuk</span>' + icon('arrowRight') + '</button>' +
      '<div class="auth-help">' + icon('shield') + '<div>' + (fromDevice ? 'Login Admin hanya untuk pengelola sistem.' : 'Perangkat picker / station packing?') + '<b>' + (fromDevice ? 'Picker & packer cukup mengetuk nama di daftar staf.' : 'Admin dapat mendaftarkan perangkat ini di Pengaturan → Perangkat, sehingga staf cukup mengetuk nama.') + '</b></div></div>' +
      (fromDevice ? '<div style="text-align:center;margin-top:16px"><button type="button" class="link-btn" id="lback">← Kembali ke daftar staf</button></div>' : '') + '</form>');
    if (fromDevice) $('#lback').onclick = function () { App.showDeviceLogin(); };
    var f = document.getElementById('lf');
    App.bindEye(f);
    f.identifier.focus();
    f.onsubmit = function (ev) {
      ev.preventDefault();
      var b = f.querySelector('.cta'); b.classList.add('busy'); b.disabled = true;
      $('#lerr').innerHTML = '';
      api('login', { identifier: f.identifier.value, password: f.password.value, device: deviceInfo() }, { silent: true })
        .then(function (r) { App.token = r.token; Store.set('fms_token', r.token); App.enter(r.me); })
        .catch(function (e) { $('#lerr').innerHTML = '<div class="err-box">' + icon('alertCircle') + '<span>' + esc(e.message) + '</span></div>'; b.classList.remove('busy'); b.disabled = false; f.password.value = ''; f.password.focus(); });
    };
  },

  bindEye: function (root) {
    $$('.pw', root).forEach(function (w) {
      var i = $('input', w), b = $('.eye', w);
      b.onclick = function () { var show = i.type === 'password'; i.type = show ? 'text' : 'password'; b.innerHTML = icon(show ? 'eyeOff' : 'eye'); i.focus(); };
    });
  },

  showChangePassword: function (forced, container) {
    var min = (App.me && App.me.config.passwordMinLength) || 8;
    var pw = function (name, ph, ac) { return '<div class="pw"><input class="in" ' + (container ? 'style="width:100%"' : '') + ' type="password" name="' + name + '" placeholder="' + ph + '" autocomplete="' + ac + '" required><button type="button" class="eye" tabindex="-1">' + icon('eye') + '</button></div>'; };
    var html = '<form id="cpf">' + (forced ? '<div class="eyebrow">Keamanan akun</div><h2>Buat password baru</h2><div class="sub">Demi keamanan, ganti password sementara Anda sebelum mulai bekerja.</div>' : '') +
      '<label class="f">Password lama</label>' + pw('o', 'Password saat ini', 'current-password') +
      '<label class="f">Password baru</label>' + pw('n', 'Min. ' + min + ' karakter, huruf + angka', 'new-password') +
      '<label class="f">Ulangi password baru</label>' + pw('n2', 'Ketik ulang password baru', 'new-password') +
      '<div id="cperr"></div>' + (forced ? '<button class="cta" type="submit"><span>Simpan & lanjutkan</span>' + icon('arrowRight') + '</button><div class="auth-help"><a href="#" id="cplo">Keluar dan login dengan akun lain</a></div>'
        : '<div class="row" style="margin-top:18px"><button class="btn pri" type="submit">Simpan password</button></div>') + '</form>';
    if (container) container.innerHTML = '<div class="card" style="max-width:460px">' + html + '</div>';
    else App.authShell(html);
    var f = document.getElementById('cpf');
    App.bindEye(f);
    if (forced) document.getElementById('cplo').onclick = function (e) { e.preventDefault(); App.logout(); };
    f.onsubmit = function (ev) {
      ev.preventDefault();
      var out = document.getElementById('cperr'), b = f.querySelector('button[type=submit]');
      if (f.n.value !== f.n2.value) { out.innerHTML = '<div class="err-box">' + icon('alertCircle') + '<span>Konfirmasi password tidak sama.</span></div>'; return; }
      b.classList.add('busy');
      api('changePassword', { oldPassword: f.o.value, newPassword: f.n.value }, { silent: true })
        .then(function (me) { toast('Password berhasil diganti.', 'ok'); if (forced) App.enter(me); else { App.remember(me); f.reset(); out.innerHTML = '<div class="ok-box">' + icon('check') + '<span>Password diganti. Sesi di perangkat lain telah dikeluarkan.</span></div>'; } })
        .catch(function (e) { out.innerHTML = '<div class="err-box">' + icon('alertCircle') + '<span>' + esc(e.message) + '</span></div>'; })
        .then(function () { b.classList.remove('busy'); });
    };
  },

  logout: function () {
    var tok = App.token;
    App.token = null; Store.del('fms_token'); Store.del('fms_me');
    App.showLogin();
    // pencabutan sesi di server berjalan di belakang — layar login tampil seketika
    if (tok) apiWith(tok, 'logout', {}, { silent: true, quiet: true }).catch(function () {});
  }
};

/* ───────── transport ───────── */
var Net = { pending: 0 };
function netStart(quiet) {
  if (quiet) return;
  Net.pending++;
  var b = document.getElementById('topbar');
  if (!b) { b = document.createElement('div'); b.id = 'topbar'; document.body.appendChild(b); }
  b.className = ''; void b.offsetWidth; b.className = 'on';
}
function netEnd(quiet) {
  if (quiet) return;
  Net.pending = Math.max(0, Net.pending - 1);
  var b = document.getElementById('topbar');
  if (b && !Net.pending) b.className = 'done';
}

function api(name, args, opts) { return apiWith(App.token, name, args, opts); }

/** Panggil server. Mengembalikan Promise data; error {code,message}. opts: silent (tanpa toast), quiet (tanpa progress bar). */
function apiWith(token, name, args, opts) {
  opts = opts || {};
  netStart(opts.quiet);
  return new Promise(function (resolve, reject) {
    var done = function (raw) {
      netEnd(opts.quiet);
      var r;
      try { r = typeof raw === 'string' ? JSON.parse(raw) : raw; } catch (e) { r = { ok: false, code: 'BAD_RESPONSE', message: 'Respon server tidak valid.' }; }
      if (r && r.ok) return resolve(r.data);
      var err = { code: r && r.code || 'ERROR', message: r && r.message || 'Terjadi kesalahan.', extra: r && r.extra };
      if (['UNAUTHENTICATED', 'SESSION_EXPIRED', 'INACTIVE'].indexOf(err.code) >= 0 && name !== 'login' && name !== 'logout') {
        App.token = null; Store.del('fms_token'); Store.del('fms_me');
        App.showLogin(err.message);
      } else if (err.code === 'MUST_CHANGE_PASSWORD') {
        api('me').then(function (me) { App.remember(me); App.showChangePassword(true); });
      } else if (!opts.silent) toast(err.message, 'err');
      reject(err);
    };
    var fail = function (e) { done({ ok: false, code: 'NETWORK', message: 'Koneksi ke server gagal: ' + (e && e.message || e) }); };
    if (window.google && google.script && google.script.run) {
      google.script.run.withSuccessHandler(done).withFailureHandler(fail).api(name, token, args || {});
    } else {
      fetch(window.FMS_API_URL, { method: 'POST', body: JSON.stringify({ fn: name, token: token, args: args || {} }) })
        .then(function (r) { return r.text(); }).then(done, fail);

      '<label class="f">Jenis masalah</label>' + Object.keys(Picker.reasons).map(function (k) { return '<button class="pk-ghost" style="justify-content:flex-start;padding:0 16px;margin-top:8px" data-r="' + k + '">' + icon('flag') + esc(Picker.reasons[k]) + '</button>'; }).join('') +

    $$('[data-r]', m).forEach(function (b) {
      b.onclick = function () {

          });
        });
      };
    });
  }
};

  <script>
/* ═════════════ PACKER — desktop + barcode scanner USB + webcam ═════════════ */
/* IndexedDB: video tetap tersimpan walau halaman di-reload. Bila IndexedDB diblok browser → fallback memori (jangan tutup tab). */
var IDB = {
  db: null, mem: null,
  open: function () {
    if (IDB.db) return Promise.resolve(IDB.db);
    if (IDB.mem) return Promise.reject(new Error('mem'));
    return new Promise(function (res, rej) {
      try {
        var r = indexedDB.open('fms_packer', 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('videos', { keyPath: 'videoId' }); };
        r.onsuccess = function () { IDB.db = r.result; res(IDB.db); };
        r.onerror = function () { rej(r.error); };
      } catch (e) { rej(e); }
    }).catch(function (e) { IDB.mem = {}; toast('IndexedDB tidak tersedia — video hanya disimpan di memori. JANGAN tutup/reload halaman sebelum upload selesai.', 'warn', 10000); throw e; });
  },
  tx: function (mode, fn, memFn) {
    return IDB.open().then(function (db) {
      return new Promise(function (res, rej) {
        var t = db.transaction('videos', mode), st = t.objectStore('videos'), out = fn(st);
        t.oncomplete = function () { res(out && out.result !== undefined ? out.result : out); };
        t.onerror = function () { rej(t.error); };
      });
    }, function () { return memFn(IDB.mem); });
  },
  all: function () { return IDB.tx('readonly', function (s) { return s.getAll(); }, function (m) { return Object.keys(m).map(function (k) { return m[k]; }); }); },
  put: function (v) { return IDB.tx('readwrite', function (s) { s.put(v); }, function (m) { m[v.videoId] = v; }); },
  del: function (id) { return IDB.tx('readwrite', function (s) { s.delete(id); }, function (m) { delete m[id]; }); }
};

var Packer = {
  me: null, cfg: null, ws: null, home: null, cur: null,
  stream: null, recorder: null, chunks: [], recStart: 0, mime: '', overlay: null, drawTimer: null, tickTimer: null, focusTimer: null,
  queue: [], uploading: false, progress: {}, busy: false, todayCount: 0,

  start: function (me) {
    Packer.me = me; Packer.cfg = me.config; Packer.ws = me.workstation;
    App.view = Packer;
    document.body.className = 'dark';
    window.addEventListener('beforeunload', Packer.onUnload);
    window.addEventListener('online', function () { Packer.processQueue(); });
    api('packHome').then(function (h) {
      Packer.home = h; Packer.todayCount = h.todayCompleted;
      if (!Packer.ws) Packer.chooseWs(); else Packer.layout();
    });
  },

  stop: function () {
    clearInterval(Packer.drawTimer); clearInterval(Packer.tickTimer); clearInterval(Packer.focusTimer);
    if (Packer.stream) Packer.stream.getTracks().forEach(function (t) { t.stop(); });
    Packer.stream = null;
    window.removeEventListener('beforeunload', Packer.onUnload);
  },

  onUnload: function (e) {
    var pending = Packer.queue.some(function (q) { return q.status !== 'closed'; });
    if (Packer.recorder || Packer.cur || pending) { e.preventDefault(); e.returnValue = ''; }
  },

  chooseWs: function () {
    var list = Packer.home.workstations;
    $app().innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px"><div class="pc-panel" style="width:min(100%,480px);padding:26px">' + brand('sm') + '<h2 style="font-size:22px;margin:22px 0 4px;color:#fff">Pilih workstation</h2><div class="muted" style="margin-bottom:12px">' + esc(Packer.me.user.name) + '</div>' +
      (list.length ? list.map(function (w) { return '<button class="btn" style="width:100%;padding:14px;margin:4px 0;justify-content:space-between" data-ws="' + esc(w.id) + '"><b class="mono">' + esc(w.code) + '</b><span class="muted">' + esc(w.name) + (w.location ? ' · ' + esc(w.location) : '') + '</span></button>'; }).join('')
        : '<div class="err-box">Belum ada workstation aktif. Hubungi Admin.</div>') +
      '<button class="btn ghost" style="margin-top:10px" id="ws-out">Logout</button></div></div>';
    $$('[data-ws]').forEach(function (b) {
      b.onclick = function () { api('packSetWorkstation', { workstationId: b.getAttribute('data-ws') }).then(function (r) { Packer.ws = r.workstation; Packer.layout(); }); };
    });
    $('#ws-out').onclick = App.logout;
  },

  layout: function () {
    $app().innerHTML =
      '<div class="pc"><div class="pc-head">' + brand('sm') + '<div class="who"><div class="r">PACKING STATION</div><div class="n">' + esc(Packer.me.user.name) + '</div></div>' +
      '<div class="right row" style="gap:14px"><button class="ws" id="pc-ws" title="Ganti workstation">' + esc(Packer.ws.code) + '</button>' +
      '<div class="cnt"><div class="v" id="pc-count">' + Packer.todayCount + '</div><div class="l">selesai hari ini</div></div>' +
      '<span class="badge b-UPLOADING hidden" id="pc-qbadge"></span><button class="btn" id="pc-out">' + icon('logout') + 'Logout</button></div></div>' +
      '<div class="pc-body"><section>' +
      '<div class="pc-cam" id="pc-cam"><canvas id="pc-canvas"></canvas><div id="pc-camtxt" style="position:absolute">Kamera aktif otomatis setelah resi valid.</div><div class="pc-rec hidden" id="pc-rec">● REC 00:00</div></div>' +
      '<video id="pc-video" muted playsinline style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></video>' +
      '<div class="row" style="margin-top:8px"><button class="btn sm" id="pc-camtest">' + icon('camera') + 'Tes kamera</button><span class="muted" style="font-size:12px" id="pc-camstate"></span></div>' +
      '<div class="pc-panel" style="margin-top:12px"><div class="row"><b>Antrian Upload Video</b><span class="muted" style="font-size:12px">Video disimpan di perangkat sampai upload sukses.</span></div><div id="pc-queue"><div class="muted" style="font-size:13px;padding:6px 0">Kosong.</div></div><div id="pc-srvpending"></div></div>' +
      '</section><section>' +
      '<div class="pc-panel"><div class="eyebrow">Scan tracking number</div>' +
      '<input class="pc-scan" id="pc-scan" autocomplete="off" spellcheck="false" placeholder="Scan / ketik resi lalu Enter">' +
      '<div id="pc-msg"></div></div>' +
      '<div class="pc-panel" style="margin-top:12px" id="pc-order"><div class="muted">Belum ada order aktif. Scan resi untuk memulai packing.</div></div>' +
      '</section></div></div>';
    var input = $('#pc-scan');
    input.onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); var v = input.value; input.value = ''; Packer.onScan(v); } };
    $('#pc-out').onclick = function () { if (Packer.cur || Packer.recorder) return toast('Selesaikan / laporkan order aktif sebelum logout.', 'err'); Packer.stop(); App.logout(); };
    $('#pc-ws').onclick = function () { if (Packer.cur) return toast('Tidak dapat ganti workstation saat ada order aktif.', 'err'); Packer.chooseWs(); };
    $('#pc-camtest').onclick = function () { Packer.startCamera().then(function (ok) { if (ok) toast('Kamera OK.', 'ok'); }); };
    clearInterval(Packer.focusTimer);
    Packer.focusTimer = setInterval(function () {
      var a = document.activeElement;
      if (!modalOpen() && a !== input && !(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName))) input.focus();
    }, 700);
    input.focus();
    Packer.refreshQueue().then(Packer.processQueue);
    Packer.renderServerPending();
  },

  msg: function (kind, title, text) {
    var b = $('#pc-msg'); if (!b) return;
    b.innerHTML = kind ? '<div class="pc-msg ' + kind + '"><h4>' + esc(title) + '</h4>' + (text ? '<div style="font-weight:500">' + esc(text) + '</div>' : '') + '</div>' : '';
  },

  /* ───────── kamera & rekaman ───────── */
  startCamera: function () {
    if (Packer.stream) return Promise.resolve(true);
    var st = $('#pc-camstate'); if (st) st.textContent = 'Menyalakan kamera…';
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { if (st) st.textContent = 'Browser tidak mendukung kamera.'; return Promise.resolve(false); }
    return navigator.mediaDevices.getUserMedia({ video: { width: { ideal: Packer.cfg.videoWidth }, height: { ideal: Packer.cfg.videoHeight }, frameRate: { ideal: 25, max: 30 } }, audio: false })
      .then(function (s) {
        Packer.stream = s;
        var v = $('#pc-video'); v.srcObject = s;
        return v.play().then(function () {
          var c = $('#pc-canvas'), ctx = c.getContext('2d');
          c.width = Packer.cfg.videoWidth; c.height = Packer.cfg.videoHeight;
          $('#pc-camtxt').classList.add('hidden');
          clearInterval(Packer.drawTimer);
          Packer.drawTimer = setInterval(function () { Packer.draw(ctx, c, v); }, 40);
          if (st) st.textContent = 'Kamera aktif · ' + (s.getVideoTracks()[0] && s.getVideoTracks()[0].label || '');
          return true;
        });
      }).catch(function (e) {
        var n = String(e && (e.name || e.message) || e);
        var m = /NotAllowed|Permission/i.test(n) ? 'Izin kamera ditolak browser.' : /NotFound|Overconstrained|DevicesNotFound/i.test(n) ? 'Webcam tidak terdeteksi.' : 'Kamera error: ' + n;
        if (st) st.innerHTML = cameraHelp(m);
        Packer.camError = m;
        return false;
      });
  },

  draw: function (ctx, c, v) {
    if (v.readyState >= 2) ctx.drawImage(v, 0, 0, c.width, c.height);
    if (!Packer.cfg.overlay) return;
    var fs = Math.max(14, Math.round(c.width / 42));
    ctx.font = 'bold ' + fs + 'px ui-monospace, Menlo, Consolas, monospace';
    ctx.textBaseline = 'top';
    var line = function (text, x, y, bg) {
      var w = ctx.measureText(text).width;
      ctx.fillStyle = bg || 'rgba(0,0,0,.6)'; ctx.fillRect(x - 5, y - 4, w + 10, fs + 9);
      ctx.fillStyle = '#fff'; ctx.fillText(text, x, y);
    };
    var info = Packer.overlay;
    if (info) { line('RESI ' + info.resi, 12, 12, 'rgba(220,38,38,.85)'); line('ORDER ' + info.order, 12, 20 + fs); }
    var ts = new Intl.DateTimeFormat('id-ID', { timeZone: Packer.cfg.tz, day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' }).format(new Date());
    line(ts + ' ' + (Packer.cfg.tz === 'Asia/Jakarta' ? 'WIB' : Packer.cfg.tz === 'Asia/Makassar' ? 'WITA' : 'WIT'), 12, c.height - 2 * fs - 26);
    line(Packer.me.user.name + ' · ' + (Packer.ws ? Packer.ws.code : '-'), 12, c.height - fs - 14);
    if (Packer.recorder && Math.floor(Date.now() / 600) % 2 === 0) { ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc(c.width - 24, 24, 10, 0, Math.PI * 2); ctx.fill(); }
  },

  pickMime: function () {
    var c = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm', 'video/mp4'];
    if (typeof MediaRecorder === 'undefined') return '';
    for (var i = 0; i < c.length; i++) if (MediaRecorder.isTypeSupported(c[i])) return c[i];
    return '';
  },

  startRecording: function (resi, orderNumber) {
    Packer.overlay = { resi: resi, order: orderNumber };
    var src = Packer.cfg.overlay ? $('#pc-canvas').captureStream(25) : Packer.stream;
    Packer.mime = Packer.pickMime();
    var opts = { videoBitsPerSecond: Packer.cfg.videoKbps * 1000 };
    if (Packer.mime) opts.mimeType = Packer.mime;
    var rec = new MediaRecorder(src, opts);
    Packer.chunks = [];
    rec.ondataavailable = function (e) { if (e.data && e.data.size) Packer.chunks.push(e.data); };
    rec.onerror = function () { toast('Recording error! Laporkan masalah RECORDING_ERROR.', 'err'); };
    rec.start(1000);
    Packer.recorder = rec;
    Packer.recStart = Date.now();
    var r = $('#pc-rec'); r.classList.remove('hidden');
    clearInterval(Packer.tickTimer);
    Packer.tickTimer = setInterval(function () {
      var s = Math.floor((Date.now() - Packer.recStart) / 1000);
      r.textContent = '● REC ' + ('0' + Math.floor(s / 60)).slice(-2) + ':' + ('0' + s % 60).slice(-2);
    }, 500);
  },

  stopRecording: function () {
    return new Promise(function (resolve) {
      var rec = Packer.recorder;
      clearInterval(Packer.tickTimer);
      var r = $('#pc-rec'); if (r) r.classList.add('hidden');
      if (!rec || rec.state === 'inactive') { Packer.recorder = null; return resolve(null); }
      rec.onstop = function () {
        var blob = new Blob(Packer.chunks, { type: (Packer.mime || 'video/webm').split(';')[0] });

        resolve(blob);
      };
      rec.stop();
    });
  },

  /* ───────── scan / order ───────── */
  onScan: function (raw) {
    var resi = String(raw || '').replace(/\s+/g, '').toUpperCase();
    if (!resi || Packer.busy) return;
    if (Packer.cur) {
      if (resi === String(Packer.cur.order.tracking_number).toUpperCase()) return Packer.finish();
      beep(false);
      return Packer.msg('warn', 'Selesaikan order aktif dulu', 'Sedang memproses ' + Packer.cur.order.tracking_number + '. Scan resi yang sama / klik SELESAI PACKING.');
    }

    Packer.msg('', '');

      if (r.result !== 'VALID') {
        beep(false);
        return Packer.msg(r.result === 'UPLOAD_PENDING' ? 'warn' : 'err', r.result.replace(/_/g, ' '), resi + ' — ' + r.message);
      }
      Packer.cur = r;
      beep(true);
      Packer.renderOrder();
      return Packer.startCamera().then(function (ok) {
        if (ok) {
          Packer.startRecording(r.order.tracking_number, r.order.order_number);
          Packer.msg('ok', r.resumed ? 'Dilanjutkan — rekaman baru dimulai' : 'Order valid — merekam', 'Masukkan & cek barang di depan kamera, lalu scan resi lagi atau klik SELESAI PACKING.');
        } else {
          Packer.msg('err', 'Camera Error — ' + (Packer.camError || ''), Packer.cfg.videoRequired ? 'Packing tidak dapat diselesaikan tanpa video. Perbaiki kamera lalu klik "Mulai rekam", atau laporkan masalah CAMERA_ERROR.' : 'Kamera tidak aktif. Anda dapat menyelesaikan tanpa video (mode darurat) dengan alasan.');
        }
        Packer.renderOrder();
      });
    }).catch(function (e) {
      beep(false);
      if (e.code === 'WORKSTATION_REQUIRED') { Packer.ws = null; return Packer.chooseWs(); }
      Packer.msg('err', 'Gagal', e.message);
    }).then(function () { Packer.busy = false; });
  },

  renderOrder: function () {
    var box = $('#pc-order'); if (!box) return;
    var c = Packer.cur;
    if (!c) { box.innerHTML = '<div class="muted">Belum ada order aktif. Scan resi untuk memulai packing.</div>'; return; }
    var o = c.order;
    box.innerHTML =
      '<div class="row"><div class="grow"><div class="muted" style="font-size:11px;font-weight:700;letter-spacing:.1em">NOMOR RESI</div><div class="mono" style="font-size:24px;font-weight:900">' + esc(o.tracking_number) + '</div></div>' + badge('PACKING_IN_PROGRESS') + '</div>' +
      '<div class="kv" style="margin-top:8px;grid-template-columns:150px 1fr"><div>Order ID</div><div class="mono">' + esc(o.order_number) + '</div><div>Picker</div><div>' + esc(o.picker_name || '-') + '</div>' +
      '<div>Picking selesai</div><div>' + esc(o.picking_completed_at || '-') + '</div><div>Total SKU</div><div><b>' + c.totalSku + '</b></div><div>Total quantity</div><div><b>' + c.totalQty + '</b></div>' +
      (o.shipping_option ? '<div>Pengiriman</div><div>' + esc(o.shipping_option) + '</div>' : '') + '</div>' +
      (o.buyer_note ? '<div class="pc-msg warn" style="margin-top:8px">Catatan pembeli: ' + esc(o.buyer_note) + '</div>' : '') +
      '<ul class="pc-items">' + c.items.map(function (i) { return '<li><div><div style="font-weight:600">' + esc(i.product_name) + '</div>' + (i.variant ? '<div class="muted" style="font-size:13px">' + esc(i.variant) + '</div>' : '') + '</div><div class="q">×' + i.quantity + '</div></li>'; }).join('') + '</ul>' +
      (Packer.recorder ? '<button class="pc-done" id="pc-finish">SELESAI PACKING</button>'
        : '<button class="pc-done" id="pc-retrycam" style="background:#2563eb">Mulai rekam</button>' + (!Packer.cfg.videoRequired ? '<button class="btn" style="width:100%;margin-top:8px" id="pc-novideo">Selesai tanpa video (darurat)</button>' : '')) +
      '<button class="btn" style="width:100%;margin-top:8px" id="pc-issue">Laporkan masalah / salah scan</button>';
    var f = $('#pc-finish'); if (f) f.onclick = Packer.finish;
    var rc = $('#pc-retrycam'); if (rc) rc.onclick = function () {
      Packer.startCamera().then(function (ok) { if (ok && Packer.cur && !Packer.recorder) { Packer.startRecording(Packer.cur.order.tracking_number, Packer.cur.order.order_number); Packer.msg('ok', 'Merekam', 'Lanjutkan packing di depan kamera.'); Packer.renderOrder(); } });
    };
    var nv = $('#pc-novideo'); if (nv) nv.onclick = Packer.noVideo;
    $('#pc-issue').onclick = Packer.issue;
  },

  finish: function () {
    var c = Packer.cur;
    if (!c || Packer.busy) return;
    if (!Packer.recorder) { toast('Belum ada rekaman. Kamera harus aktif.', 'err'); return; }
    if (Date.now() - Packer.recStart < Packer.cfg.minRecordingSeconds * 1000) { toast('Rekaman terlalu singkat. Tunjukkan proses packing di kamera.', 'err'); return; }
    Packer.busy = true;
    var start = Packer.recStart, end = Date.now();
    Packer.stopRecording().then(function (blob) {
      if (!blob || blob.size < 1000) throw { message: 'Rekaman kosong. Klik "Mulai rekam" untuk merekam ulang.' };
      return api('packFinish', { sessionId: c.sessionId, recordingStart: start, recordingEnd: end, sizeBytes: blob.size, mimeType: blob.type }, { silent: true }).then(function (r) {
        return IDB.put({ videoId: r.videoId, sessionId: c.sessionId, tracking: c.order.tracking_number, orderNumber: c.order.order_number, fileName: r.fileName, blob: blob, mime: blob.type, size: blob.size, createdAt: Date.now(), status: 'queued', attempts: 0 })
          .then(function () { return r; });
      });
    }).then(function () {
      beep(true);
      Packer.msg('ok', 'Rekaman selesai', c.order.tracking_number + ' — video sedang diupload. Silakan scan resi berikutnya.');
      Packer.cur = null; Packer.renderOrder();
      return Packer.refreshQueue().then(Packer.processQueue);
    }).catch(function (e) {
      Packer.msg('err', 'Gagal menyimpan rekaman', e.message);
      if (e.code === 'SESSION_CLOSED') { Packer.cur = null; }
      Packer.renderOrder();
    }).then(function () { Packer.busy = false; });
  },

  issue: function () {
    var c = Packer.cur; if (!c) return;
    var R = Packer.home.reasons;
    var m = modal('<h3>Laporkan masalah — ' + esc(c.order.tracking_number) + '</h3>' +
      Object.keys(R).map(function (k) { return '<button class="btn" style="width:100%;justify-content:flex-start;margin:3px 0;padding:10px" data-r="' + k + '">' + esc(R[k]) + ' <span class="muted mono" style="font-size:11px;margin-left:auto">' + k + '</span></button>'; }).join('') +
      '<label class="f">Catatan</label><input class="in" style="width:100%" id="pc-note"><p class="muted" style="font-size:12px">Salah scan → order kembali ke antrian packing. Lainnya → order EXCEPTION ke Admin. Rekaman berjalan dibatalkan.</p><button class="btn" data-close>Batal</button>');
    $$('[data-r]', m).forEach(function (b) {
      b.onclick = function () {
        var reason = b.getAttribute('data-r'), note = $('#pc-note', m).value;
        m.close();
        Packer.stopRecording().then(function () {
          return api('packException', { sessionId: c.sessionId, reason: reason, note: note });
        }).then(function (r) {
          Packer.msg('warn', reason === 'WRONG_SCAN' ? 'Dibatalkan (salah scan)' : 'Exception dilaporkan', c.order.tracking_number + ' → ' + (r.status === 'EXCEPTION' ? 'diteruskan ke Admin' : 'kembali ke antrian packing') + '.');
          Packer.cur = null; Packer.renderOrder();
        }).catch(function () { Packer.renderOrder(); });
      };
    });
  },

  noVideo: function () {
    var c = Packer.cur; if (!c) return;
    promptText('Selesai tanpa video (darurat)', 'Alasan (wajib)', { min: 5, ok: 'Selesaikan', danger: true, html: '<div class="warn-box">Order akan PACKING COMPLETED tanpa bukti video dan otomatis dibuat exception untuk Admin.</div>' }).then(function (reason) {
      if (!reason) return;
      api('packCompleteNoVideo', { sessionId: c.sessionId, reason: reason }).then(function () {
        Packer.todayCount++; $('#pc-count').textContent = Packer.todayCount;
        Packer.msg('warn', 'PACKING COMPLETED tanpa video', c.order.tracking_number);
        Packer.cur = null; Packer.renderOrder();
      });
    });
  },

  /* ───────── antrian upload (IndexedDB) ───────── */
  refreshQueue: function () {
    return IDB.all().then(function (all) {
      Packer.queue = all.sort(function (a, b) { return a.createdAt - b.createdAt; });
      Packer.renderQueue();
      return all;
    }).catch(function () { Packer.queue = []; Packer.renderQueue(); });
  },

  renderQueue: function () {
    var box = $('#pc-queue'); if (!box) return;
    var q = Packer.queue;
    var pend = q.filter(function (x) { return x.status !== 'closed'; }).length;
    var bd = $('#pc-qbadge'); if (bd) { bd.textContent = pend + ' upload'; bd.classList.toggle('hidden', !pend); }
    if (!q.length) { box.innerHTML = '<div class="muted" style="font-size:13px;padding:6px 0">Kosong.</div>'; return; }
    box.innerHTML = q.map(function (x) {
      var p = Packer.progress[x.videoId] || 0;
      var st = { queued: 'Menunggu', uploading: 'Mengupload ' + Math.round(p * 100) + '%', failed: 'Video gagal diupload. Silakan retry.', closed: 'Sesi ditutup' }[x.status] || x.status;
      return '<div class="q-item"><span class="mono" style="min-width:150px">' + esc(x.tracking) + '</span><span class="muted">' + fmtBytes(x.size) + '</span>' +
        '<div class="bar"><i style="width:' + Math.round(p * 100) + '%"></i></div><span style="min-width:120px;font-size:12px" class="' + (x.status === 'failed' || x.status === 'closed' ? '' : 'muted') + '">' + esc(st) + '</span>' +
        (x.status === 'failed' || x.status === 'closed' ? '<button class="btn sm" data-retry="' + esc(x.videoId) + '">Retry</button>' : '') +
        '<button class="btn sm" data-save="' + esc(x.videoId) + '" title="Simpan salinan lokal">⬇</button>' +
        (x.status === 'closed' ? '<button class="btn sm" data-discard="' + esc(x.videoId) + '">Hapus lokal</button>' : '') + '</div>' +
        (x.error ? '<div style="font-size:11px;color:#fca5a5;padding:0 0 4px">' + esc(x.error) + '</div>' : '');
    }).join('');
    $$('[data-retry]', box).forEach(function (b) { b.onclick = function () { Packer.retry(b.getAttribute('data-retry')); }; });
    $$('[data-save]', box).forEach(function (b) { b.onclick = function () { Packer.saveLocal(b.getAttribute('data-save')); }; });
    $$('[data-discard]', box).forEach(function (b) { b.onclick = function () { Packer.discard(b.getAttribute('data-discard')); }; });
  },

  renderServerPending: function () {
    var box = $('#pc-srvpending'); if (!box || !Packer.home) return;
    IDB.all().catch(function () { return []; }).then(function (local) {
      var have = {}; local.forEach(function (x) { have[x.videoId] = true; });
      var miss = Packer.home.pendingVideos.filter(function (v) { return !have[v.videoId]; });
      box.innerHTML = miss.length ? '<div class="pc-msg warn" style="font-size:13px">Video berikut belum terupload dan file-nya tidak ada di perangkat ini: ' + miss.map(function (v) { return '<span class="mono">' + esc(v.tracking) + '</span>'; }).join(', ') + '. Upload dari perangkat asal, atau minta Admin melepas lock lalu packing ulang.</div>' : '';
    });
  },

  blobToB64: function (blob) {
    return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(String(r.result).split(',')[1] || ''); }; r.onerror = function () { rej(r.error); }; r.readAsDataURL(blob); });
  },

  processQueue: function () {
    if (Packer.uploading) return;
    var item = Packer.queue.filter(function (x) { return x.status === 'queued' || x.status === 'uploading'; })[0];
    if (!item) return;
    Packer.uploading = true;
    item.status = 'uploading'; item.attempts = (item.attempts || 0) + 1; item.error = '';
    var chunk = Packer.chunkSize || Packer.cfg.uploadChunkBytes;
    var finish = function () { Packer.uploading = false; Packer.refreshQueue().then(Packer.processQueue); };
    IDB.put(item).then(function () {
      Packer.renderQueue();
      return api('videoInit', { videoId: item.videoId }, { silent: true });
    }).then(function (r) {
      if (r.done) return true;
      var offset = r.offset;
      var step = function () {
        if (offset >= item.size) return true;
        var part = item.blob.slice(offset, Math.min(offset + chunk, item.size));
        return Packer.blobToB64(part).then(function (b64) {
          return api('videoChunk', { videoId: item.videoId, offset: offset, data: b64 }, { silent: true });
        }).then(function (res) {
          if (res.done) return true;
          offset = res.received || offset + part.size;
          Packer.progress[item.videoId] = offset / item.size; Packer.renderQueue();
          return step();
        }, function (e) {
          // payload terlalu besar → perkecil potongan (tetap kelipatan 256 KB)
          if (e.code === 'NETWORK' && chunk > 1024 * 1024) { chunk = chunk / 2; Packer.chunkSize = chunk; return api('videoInit', { videoId: item.videoId }, { silent: true }).then(function (r2) { if (r2.done) return true; offset = r2.offset; return step(); }); }
          throw e;
        });
      };
      return step();
    }).then(function () {
      delete Packer.progress[item.videoId];
      Packer.todayCount++; var cnt = $('#pc-count'); if (cnt) cnt.textContent = Packer.todayCount;
      toast('✓ PACKING COMPLETED — ' + item.tracking + ' (video tersimpan di Drive)', 'ok');
      return IDB.del(item.videoId);
    }).catch(function (e) {
      var closed = ['SESSION_CLOSED', 'FORBIDDEN', 'NOT_FOUND'].indexOf(e.code) >= 0;
      item.status = closed ? 'closed' : 'failed';
      item.error = closed ? e.message : 'Video gagal diupload. Silakan retry. (' + (e.message || '') + ')';
      if (!closed) api('videoFailed', { videoId: item.videoId, error: e.message }, { silent: true }).catch(function () {});
      toast('Upload ' + item.tracking + ' gagal: ' + e.message, 'err');
      return IDB.put(item).then(function () {
        if (!closed && item.attempts < 5) setTimeout(function () { item.status = 'queued'; IDB.put(item).then(function () { Packer.refreshQueue().then(Packer.processQueue); }); }, 5000 * item.attempts);
      });
    }).then(finish, finish);
  },

  retry: function (id) {
    var it = Packer.queue.filter(function (x) { return x.videoId === id; })[0]; if (!it) return;
    it.status = 'queued'; it.attempts = 0; it.error = '';
    IDB.put(it).then(Packer.refreshQueue).then(Packer.processQueue);
  },
  saveLocal: function (id) {
    var it = Packer.queue.filter(function (x) { return x.videoId === id; })[0]; if (!it) return;
    var a = document.createElement('a'); a.href = URL.createObjectURL(it.blob); a.download = it.fileName || (it.tracking + '_' + it.orderNumber + '.webm'); document.body.appendChild(a); a.click(); a.remove();
  },
  discard: function (id) {
    ask('Hapus salinan lokal video ini? Pastikan sudah diunduh bila diperlukan sebagai bukti.', 'Hapus', true).then(function (y) { if (y) IDB.del(id).then(Packer.refreshQueue); });
  }
};
</script>

/** Grafik batang berkelompok (SVG), jam 07–22 atau lebih lebar bila ada data di luar rentang. */
Admin.hourChart = function (h) {
  var from = 7, to = 22;
  for (var i = 0; i < 24; i++) if (h.pick[i] || h.pack[i]) { from = Math.min(from, i); to = Math.max(to, i); }
  var hours = []; for (i = from; i <= to; i++) hours.push(i);
  var max = 0; hours.forEach(function (x) { max = Math.max(max, h.pick[x], h.pack[x]); });
  var step = max <= 4 ? 1 : max <= 10 ? 2 : max <= 25 ? 5 : max <= 50 ? 10 : Math.ceil(max / 50) * 10;
  var top = Math.max(step * 4, Math.ceil(max / step) * step);
  var W = 640, H = 220, L = 30, B = 24, T = 8, pw = W - L - 4, ph2 = H - B - T;
  var gw = pw / hours.length, bw = Math.max(3, Math.min(12, (gw - 8) / 2));
  var y = function (v) { return T + ph2 - (v / top) * ph2; };
  var bar = function (x, v, col) {
    if (!v) return '';
    var y0 = y(v), hgt = T + ph2 - y0, r = Math.min(4, bw / 2, hgt);
    return '<path fill="' + col + '" d="M' + x + ',' + (T + ph2) + 'V' + (y0 + r) + 'Q' + x + ',' + y0 + ' ' + (x + r) + ',' + y0 + 'H' + (x + bw - r) + 'Q' + (x + bw) + ',' + y0 + ' ' + (x + bw) + ',' + (y0 + r) + 'V' + (T + ph2) + 'Z"/>';
  };
  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Order selesai per jam">';
  for (var g = 0; g <= top; g += step) svg += '<line class="gl" x1="' + L + '" x2="' + (W - 4) + '" y1="' + y(g) + '" y2="' + y(g) + '"/><text class="ax" x="' + (L - 8) + '" y="' + (y(g) + 4) + '" text-anchor="end">' + g + '</text>';
  hours.forEach(function (hr, k) {
    var cx = L + gw * k + gw / 2;
    svg += bar(cx - bw - 1, h.pick[hr], SERIES.pick) + bar(cx + 1, h.pack[hr], SERIES.pack);
    if (k % (hours.length > 12 ? 2 : 1) === 0) svg += '<text class="ax" x="' + cx + '" y="' + (H - 6) + '" text-anchor="middle">' + ('0' + hr).slice(-2) + '</text>';
    svg += '<rect class="hit" x="' + (L + gw * k) + '" y="' + T + '" width="' + gw + '" height="' + ph2 + '" data-h="' + hr + '" data-a="' + h.pick[hr] + '" data-b="' + h.pack[hr] + '" data-x="' + cx + '" data-y="' + y(Math.max(h.pick[hr], h.pack[hr])) + '"/>';
  });
  return svg + '</svg>';
};

  var f = $('#of');

/* ───────── Import (§14–§17) — drag & drop ───────── */
Admin.pages.import = function (el) {
  var cfg = Admin.me.config, file = null;
  el.innerHTML = ph('Shopee', 'Import Orders') +
    '<div class="imp"><div><input type="file" id="imf" accept=".xlsx,.csv" hidden><div id="imz"></div><div id="imr"></div></div>' +
    '<div class="tips"><div style="font-weight:800">Cara export dari Shopee</div><ol><li><span>Seller Centre → Pesanan Saya</span></li><li><span>Pilih tab <b>Perlu Dikirim</b></span></li><li><span>Klik <b>Export</b>, unduh file .xlsx</span></li><li><span>Tarik file ke kotak di samping</span></li></ol>' +
    '<div class="muted" style="font-size:12px;margin-top:12px;line-height:1.6">Order tanpa resi masuk sebagai <b>Menunggu resi</b> dan otomatis siap picking saat file berikutnya berisi resinya. Import ulang file yang sama aman — tidak ada duplikat.</div></div></div>' +
    '<div class="sect">Riwayat import</div><div id="imh"></div>';
  var input = $('#imf');
  var zone = function () {
    if (!file) {
      $('#imz').innerHTML = '<div class="drop" id="drop"><div class="di">' + icon('upload') + '</div><div class="dt">Tarik & lepas file export Shopee di sini</div><div class="ds">atau <b>klik untuk memilih file</b> · maks ' + cfg.maxImportMb + ' MB</div><div class="fmt">' + cfg.allowedImport.split(',').map(function (x) { return '<span>.' + esc(x) + '</span>'; }).join('') + '</div></div>';
      var d = $('#drop');
      d.onclick = function () { input.click(); };
      ['dragenter', 'dragover'].forEach(function (ev) { d.addEventListener(ev, function (e) { e.preventDefault(); d.classList.add('over'); }); });
      ['dragleave', 'drop'].forEach(function (ev) { d.addEventListener(ev, function (e) { e.preventDefault(); d.classList.remove('over'); }); });
      d.addEventListener('drop', function (e) { if (e.dataTransfer.files.length) pick(e.dataTransfer.files[0]); });
      return;
    }
    var ext = file.name.split('.').pop().toLowerCase();
    $('#imz').innerHTML = '<div class="file-card"><div class="fi">' + esc(ext.toUpperCase()) + '</div><div class="grow"><div class="fn">' + esc(file.name) + '</div><div class="fs">' + fmtBytes(file.size) + ' · siap diimport</div><div id="imp-prog"></div></div>' +
      '<button class="btn ghost" id="imx" title="Ganti file">' + icon('x') + '</button><button class="btn pri" id="imb" style="height:42px;padding:0 18px">' + icon('upload') + 'Import sekarang</button></div>';
    $('#imx').onclick = function () { file = null; zone(); };
    $('#imb').onclick = run;
  };
  var pick = function (f) {
    var ext = f.name.split('.').pop().toLowerCase();
    if (cfg.allowedImport.split(',').indexOf(ext) < 0) return toast('Format .' + ext + ' tidak diizinkan. Gunakan ' + cfg.allowedImport + '.', 'err');
    if (f.size > cfg.maxImportMb * 1048576) return toast('Ukuran file melebihi batas ' + cfg.maxImportMb + ' MB.', 'err');
    file = f; $('#imr').innerHTML = ''; zone();
  };
  input.onchange = function () { if (input.files.length) pick(input.files[0]); input.value = ''; };
  var run = function () {
    var b = $('#imb'); b.classList.add('busy'); b.disabled = true; $('#imx').disabled = true;
    $('#imp-prog').innerHTML = '<div class="fs" style="margin-top:6px">Mengunggah & memvalidasi… file xlsx dikonversi di Google Drive (10–60 dtk)</div><div class="indet"></div>';
    var r = new FileReader();
    r.onload = function () {
      api('importOrders', { filename: file.name, base64: String(r.result).split(',')[1] }, { silent: true }).then(function (S) {
        file = null; zone(); $('#imr').innerHTML = Admin.importResult(S); delete Admin.cache.dashboard; hist();
      }).catch(function (e) { zone(); $('#imr').innerHTML = '<div class="err-box">' + icon('alertCircle') + '<span>' + esc(e.message) + '</span></div>'; });
    };
    r.readAsDataURL(file);
  };
  var hist = function () {
    Admin.swr('imports', 'importsList').then(function (h) {
      $('#imh').innerHTML = tbl(['Waktu', 'File', 'Oleh', 'Baris', 'Order', 'Sukses', 'Duplikat', 'Ditolak (baris)', 'Status'], h.batches.map(function (x) {
        return '<tr class="click" data-b="' + esc(x.id) + '"><td>' + esc(x.uploaded_at) + '</td><td>' + esc(x.filename) + '</td><td>' + esc(x.uploaded_by_name) + '</td><td>' + esc(x.total_rows) + '</td><td>' + esc(x.total_orders) + '</td><td>' + esc(x.successful_orders) + '</td><td>' + esc(x.duplicate_orders) + '</td><td>' + esc(x.rejected_rows) + '</td><td>' + importBadge(x.status) + '</td></tr>';
      }), 'Belum ada import.');
      $$('[data-b]', $('#imh')).forEach(function (tr) {
        tr.onclick = function () { api('importDetail', { id: tr.getAttribute('data-b') }).then(function (d) { var s = d.summary || {}; var S = s.summary || {}; S.errors = s.errors || []; S.warnings = s.warnings || []; S.filename = d.filename; modal(Admin.importResult(S) + '<button class="btn" data-close style="margin-top:10px">Tutup</button>', { wide: true }); }); };
      });
    });
  };
  zone(); hist();
};

    stat(S.successfulOrders, 'Successful Orders') + stat(S.rejectedRows, 'Rejected Rows') + stat(S.duplicateOrders, 'Duplicate Orders') + stat((S.errors || []).length + (S.errorsTruncated ? '+' : ''), 'Validation Errors') + '</div>' +

    ((S.errors || []).length ? '<h4 style="color:var(--err)">Validation Errors</h4><div class="err-box" style="font-weight:500;max-height:260px;overflow:auto">' + list(S.errors) + '</div>' : '') +

      '<button class="btn pri" style="margin-top:16px;height:42px">' + icon('plus') + 'Daftarkan perangkat ini</button></form>' +
      '<div class="muted" style="font-size:12px;margin-top:14px;line-height:1.6">Siapa pun yang memegang perangkat terdaftar dapat memilih nama staf. Simpan perangkat di area kerja, dan cabut perangkat yang hilang di daftar sebelah.</div></div>' +
      '<div class="panel"><div class="panel-h"><div><h3>Perangkat terdaftar</h3><div class="sub">' + r.devices.filter(function (d) { return d.status === 'ACTIVE'; }).length + ' aktif</div></div></div>' +
      (r.devices.length ? '<table class="team">' + r.devices.map(function (d) {
        return '<tr><td style="width:40px"><div class="avatar" style="width:34px;height:34px;border-radius:10px">' + icon(d.kind === 'PACKER' ? 'monitor' : 'scan') + '</div></td><td><b>' + esc(d.name) + '</b><div class="muted" style="font-size:12px">' + (d.kind === 'PACKER' ? 'Station packing' + (d.workstation ? ' · ' + esc(d.workstation.code) : '') : 'HP picker') + (d.last_used_at ? ' · terakhir ' + esc(d.last_user) + ', ' + esc(d.last_used_at.slice(5, 16)) : ' · belum dipakai') + '</div></td>' +
          '<td>' + badge(d.status === 'ACTIVE' ? 'ACTIVE' : 'INACTIVE') + '</td><td style="text-align:right">' + (d.status === 'ACTIVE' ? '<button class="btn sm" data-rv="' + esc(d.id) + '" data-n="' + esc(d.name) + '">Cabut</button>' : '') + '</td></tr>';
      }).join('') + '</table>' : '<div class="empty">Belum ada perangkat terdaftar.</div>') + '</div></div>';
    var f = $('#dvf', box);
    var syncWs = function () {
      var isPack = f.kind.value === 'PACKER';
      $('#dv-ws', box).classList.toggle('hidden', !isPack);
      if (isPack && !f.ws.options.length) api('workstationsList', {}, { quiet: true }).then(function (w) { f.ws.innerHTML = w.workstations.filter(function (x) { return x.status === 'ACTIVE'; }).map(function (x) { return opt(x.id, x.workstation_code + ' — ' + x.workstation_name); }).join(''); });
    };
    f.kind.onchange = syncWs;
    f.onsubmit = function (e) {
      e.preventDefault();
      busy(f.querySelector('.btn.pri'), api('deviceRegister', { name: f.name.value, kind: f.kind.value, workstationId: f.ws.value })).then(function (x) {
        Store.set('fms_device', x.deviceToken);
        Store.set('fms_device_info', JSON.stringify({ device: x.device, users: [] }));
        delete Admin.cache.devices;
        toast('Perangkat terdaftar. Logout untuk menampilkan daftar nama staf.', 'ok', 6000);
        Admin.devices(box);
      });
    };
    var fg = $('#dv-forget', box); if (fg) fg.onclick = function () { Store.del('fms_device'); Store.del('fms_device_info'); toast('Pendaftaran di browser ini dilepas.', 'ok'); Admin.devices(box); };
    $$('[data-rv]', box).forEach(function (b) {
      b.onclick = function () {
        ask('Cabut perangkat "' + b.getAttribute('data-n') + '"? Staf yang sedang login di perangkat itu langsung keluar, dan perangkat harus didaftarkan ulang.', 'Cabut', true).then(function (y) {
          if (y) busy(b, api('deviceRevoke', { id: b.getAttribute('data-rv') })).then(function () { delete Admin.cache.devices; toast('Perangkat dicabut.', 'ok'); Admin.devices(box); });
        });
      };
    });
  });
};
</script>

  <script>App.start();</script>
</body>
</html>
